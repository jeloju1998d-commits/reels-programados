name: Comprobar tokens

# No publica nada: solo mira qué cuenta cubre cada token y lo anota en comprobacion.txt
on:
  workflow_dispatch:
  push:
    paths:
      - "comprobar.txt"

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar
        env:
          IG_FB_TOKEN: ${{ secrets.IG_FB_TOKEN }}
          COMPROBAR: "1"
        run: python publicar.py
      - name: Guardar el resultado
        run: |
          git config user.name "publicador"
          git config user.email "publicador@users.noreply.github.com"
          git add comprobacion.txt
          git diff --cached --quiet && exit 0
          git commit -m "Resultado de la comprobacion"
          git pull --rebase
          git push
